<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دفتر حسابات محمد محمود الحداد</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f2f2f2;
  color: #111;
  font-size: 18px;
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  background: #1a7a4a;
  color: #fff;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header h1 { font-size: 26px; font-weight: 700; }
.header-sub { font-size: 14px; opacity: .8; margin-top: 2px; }

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }

/* ── HOME: NAMES LIST ── */
.home-wrap { padding: 16px; max-width: 700px; margin: 0 auto; }

.add-name-box {
  background: #fff;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.add-name-box h2 { font-size: 20px; margin-bottom: 14px; color: #1a7a4a; }
.input-row { display: flex; gap: 10px; }
.input-row input {
  flex: 1;
  padding: 14px 16px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 20px;
  font-family: inherit;
  outline: none;
}
.input-row input:focus { border-color: #1a7a4a; }
.btn-add {
  background: #1a7a4a;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 14px 22px;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}
.btn-add:active { opacity: .8; }

.name-card {
  background: #fff;
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  border-right: 6px solid #1a7a4a;
  transition: box-shadow .2s;
}
.name-card:active { box-shadow: 0 4px 16px rgba(0,0,0,.15); }
.name-info { flex: 1; }
.name-text { font-size: 22px; font-weight: 700; }
.name-balance { font-size: 17px; margin-top: 4px; }
.bal-pos { color: #1a7a4a; }
.bal-neg { color: #d32f2f; }
.bal-zero { color: #888; }
.name-arrow { font-size: 28px; color: #bbb; margin-right: 8px; }
.name-del {
  background: none;
  border: none;
  color: #d32f2f;
  font-size: 22px;
  cursor: pointer;
  padding: 6px 10px;
}

.empty-msg {
  text-align: center;
  color: #aaa;
  font-size: 20px;
  padding: 50px 20px;
}

/* ── LEDGER PAGE ── */
.ledger-header {
  background: #1a7a4a;
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.back-btn {
  background: rgba(255,255,255,.2);
  border: none;
  color: #fff;
  font-size: 22px;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
}
.ledger-title { font-size: 22px; font-weight: 700; flex: 1; }
.ledger-bal-header { font-size: 18px; font-weight: 700; }

.ledger-wrap { max-width: 700px; margin: 0 auto; padding: 16px; }

/* SUMMARY BAR */
.summary-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.sum-box {
  background: #fff;
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.07);
}
.sum-label { font-size: 13px; color: #888; margin-bottom: 4px; }
.sum-val { font-size: 22px; font-weight: 700; }
.sum-green { color: #1a7a4a; }
.sum-red { color: #d32f2f; }
.sum-blue { color: #1565c0; }

/* ADD ENTRY FORM */
.entry-form {
  background: #fff;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
}
.entry-form h3 { font-size: 20px; color: #1a7a4a; margin-bottom: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.form-row.three { grid-template-columns: 1fr 1fr 1fr; }
.form-group label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 5px;
  font-weight: 600;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 19px;
  font-family: inherit;
  outline: none;
  background: #fafafa;
}
.form-group input:focus,
.form-group select:focus { border-color: #1a7a4a; }
.form-group.full { grid-column: 1 / -1; }

.type-toggle { display: flex; gap: 0; border-radius: 10px; overflow: hidden; border: 2px solid #ddd; margin-bottom: 14px; }
.type-btn {
  flex: 1;
  padding: 14px;
  border: none;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  background: #f5f5f5;
  color: #888;
  transition: all .2s;
}
.type-btn.credit.active { background: #1a7a4a; color: #fff; }
.type-btn.debit.active { background: #d32f2f; color: #fff; }

.btn-save {
  width: 100%;
  background: #1a7a4a;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 16px;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 6px;
  font-family: inherit;
}
.btn-save:active { opacity: .85; }

/* TRANSACTIONS LIST */
.tx-list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.tx-list-title { font-size: 20px; font-weight: 700; color: #333; }
.btn-pdf {
  background: #1565c0;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.btn-pdf:active { opacity: .85; }

.tx-row {
  background: #fff;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 10px;
  box-shadow: 0 1px 5px rgba(0,0,0,.07);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-right: 5px solid #ddd;
}
.tx-row.credit { border-right-color: #1a7a4a; }
.tx-row.debit  { border-right-color: #d32f2f; }
.tx-info { flex: 1; }
.tx-type-label { font-size: 13px; font-weight: 700; text-transform: uppercase; margin-bottom: 3px; }
.tx-row.credit .tx-type-label { color: #1a7a4a; }
.tx-row.debit  .tx-type-label { color: #d32f2f; }
.tx-note { font-size: 17px; color: #333; margin-bottom: 3px; }
.tx-date { font-size: 13px; color: #aaa; }
.tx-amount { font-size: 24px; font-weight: 700; margin-left: 10px; }
.tx-row.credit .tx-amount { color: #1a7a4a; }
.tx-row.debit  .tx-amount { color: #d32f2f; }
.tx-del {
  background: none;
  border: none;
  color: #ccc;
  font-size: 20px;
  cursor: pointer;
  padding: 4px 8px;
  margin-right: 4px;
}
.tx-del:active { color: #d32f2f; }

.running-bal {
  font-size: 13px;
  color: #888;
  margin-top: 2px;
}

.no-tx { text-align: center; color: #bbb; font-size: 19px; padding: 40px 0; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 18px;
  opacity: 0;
  transition: opacity .3s;
  z-index: 999;
  pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ══ HOME PAGE ══ -->
<div class="page active" id="page-home">
  <div class="header">
    <div>
      <div style="font-size:32px;font-weight:900;letter-spacing:1px">دفتر حسابات محمد محمود الحداد</div>
    </div>
    <div id="totalSummary" style="text-align:left;font-size:15px;opacity:.9"></div>
  </div>

  <div class="home-wrap">
    <div class="add-name-box">
      <h2>➕ إضافة اسم جديد / Add New Name</h2>
      <div class="input-row">
        <input type="text" id="newName" placeholder="اكتب الاسم هنا..." onkeydown="if(event.key==='Enter')addName()">
        <button class="btn-add" onclick="addName()">إضافة</button>
      </div>
    </div>
    <div id="namesList"></div>
  </div>
</div>

<!-- ══ LEDGER PAGE ══ -->
<div class="page" id="page-ledger">
  <div class="ledger-header">
    <button class="back-btn" onclick="goHome()">▶ رجوع</button>
    <div class="ledger-title" id="ledgerName"></div>
    <div class="ledger-bal-header" id="ledgerBalHeader"></div>
  </div>

  <div class="ledger-wrap">
    <div class="summary-bar">
      <div class="sum-box">
        <div class="sum-label">إجمالي دائن / Credit</div>
        <div class="sum-val sum-green" id="sumCredit">£0.00</div>
      </div>
      <div class="sum-box">
        <div class="sum-label">إجمالي مدين / Debit</div>
        <div class="sum-val sum-red" id="sumDebit">£0.00</div>
      </div>
      <div class="sum-box">
        <div class="sum-label">الرصيد / Balance</div>
        <div class="sum-val sum-blue" id="sumBalance">£0.00</div>
      </div>
    </div>

    <div class="entry-form">
      <h3>➕ إدخال جديد / New Entry</h3>
      <div class="type-toggle">
        <button class="type-btn credit active" id="btnCredit" onclick="setType('credit')">
          دائن ▲ Credit
        </button>
        <button class="type-btn debit" id="btnDebit" onclick="setType('debit')">
          مدين ▼ Debit
        </button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>المبلغ / Amount (£) *</label>
          <input type="number" id="eAmount" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label>التاريخ / Date</label>
          <input type="date" id="eDate">
        </div>
      </div>
      <div class="form-group full" style="margin-bottom:10px">
        <label>ملاحظات / Notes</label>
        <input type="text" id="eNote" placeholder="سبب المعاملة... (اختياري)" onkeydown="if(event.key==='Enter')saveEntry()">
      </div>
      <button class="btn-save" onclick="saveEntry()">✓ حفظ / Save</button>
    </div>

    <div class="tx-list-header">
      <div class="tx-list-title">📋 السجل / Ledger</div>
      <button class="btn-pdf" onclick="exportPDF()">📄 PDF</button>
    </div>
    <div id="txList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
//  STORAGE — auto-save on every change
// ══════════════════════════════════════
let DB = JSON.parse(localStorage.getItem('daftar_db') || '{"names":[],"entries":{}}');

function save() {
  localStorage.setItem('daftar_db', JSON.stringify(DB));
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
window.onload = () => {
  document.getElementById('eDate').value = today();
  renderHome();
};

function today() {
  return new Date().toISOString().split('T')[0];
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function fmt(n) {
  return '£' + Math.abs(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ══════════════════════════════════════
//  HOME
// ══════════════════════════════════════
function renderHome() {
  const list = document.getElementById('namesList');

  if (!DB.names.length) {
    list.innerHTML = '<div class="empty-msg">لا يوجد أسماء بعد<br>No names yet</div>';
    document.getElementById('totalSummary').innerHTML = '';
    return;
  }

  let totalCredit = 0, totalDebit = 0;
  DB.names.forEach(name => {
    const entries = DB.entries[name] || [];
    entries.forEach(e => {
      if (e.type === 'credit') totalCredit += e.amount;
      else totalDebit += e.amount;
    });
  });
  const net = totalCredit - totalDebit;
  document.getElementById('totalSummary').innerHTML =
    `<div>إجمالي: ${fmt(totalCredit)} دائن</div>
     <div>${fmt(totalDebit)} مدين</div>
     <div style="font-weight:700">${net >= 0 ? '+' : '-'}${fmt(net)}</div>`;

  list.innerHTML = DB.names.map(name => {
    const entries = DB.entries[name] || [];
    let credit = 0, debit = 0;
    entries.forEach(e => { if (e.type === 'credit') credit += e.amount; else debit += e.amount; });
    const bal = credit - debit;
    const balClass = bal > 0 ? 'bal-pos' : bal < 0 ? 'bal-neg' : 'bal-zero';
    const balText = bal > 0 ? `له ${fmt(bal)}` : bal < 0 ? `عليه ${fmt(bal)}` : 'متسوي £0.00';
    return `
      <div class="name-card" onclick="openLedger('${encodeURIComponent(name)}')">
        <div class="name-arrow">◀</div>
        <div class="name-info">
          <div class="name-text">${name}</div>
          <div class="name-balance ${balClass}">${balText} · ${entries.length} معاملة</div>
        </div>
        <button class="name-del" onclick="event.stopPropagation();deleteName('${encodeURIComponent(name)}')">🗑</button>
      </div>`;
  }).join('');
}

function addName() {
  const input = document.getElementById('newName');
  const name = input.value.trim();
  if (!name) { toast('أدخل اسماً / Enter a name'); return; }
  if (DB.names.includes(name)) { toast('الاسم موجود مسبقاً / Name already exists'); return; }
  DB.names.push(name);
  if (!DB.entries[name]) DB.entries[name] = [];
  save();
  input.value = '';
  renderHome();
  toast('✓ تم إضافة ' + name);
}

function deleteName(encoded) {
  const name = decodeURIComponent(encoded);
  if (!confirm(`حذف "${name}" وكل معاملاته؟\nDelete "${name}" and all entries?`)) return;
  DB.names = DB.names.filter(n => n !== name);
  delete DB.entries[name];
  save();
  renderHome();
}

// ══════════════════════════════════════
//  LEDGER
// ══════════════════════════════════════
let currentName = '';
let entryType = 'credit';

function openLedger(encoded) {
  currentName = decodeURIComponent(encoded);
  entryType = 'credit';
  setType('credit');
  document.getElementById('eAmount').value = '';
  document.getElementById('eNote').value = '';
  document.getElementById('eDate').value = today();
  document.getElementById('ledgerName').textContent = currentName;
  document.getElementById('page-home').classList.remove('active');
  document.getElementById('page-ledger').classList.add('active');
  renderLedger();
}

function goHome() {
  document.getElementById('page-ledger').classList.remove('active');
  document.getElementById('page-home').classList.add('active');
  renderHome();
}

function setType(type) {
  entryType = type;
  document.getElementById('btnCredit').classList.toggle('active', type === 'credit');
  document.getElementById('btnDebit').classList.toggle('active', type === 'debit');
}

function saveEntry() {
  const amount = parseFloat(document.getElementById('eAmount').value);
  const note = document.getElementById('eNote').value.trim();
  const date = document.getElementById('eDate').value || today();

  if (!amount || amount <= 0) { toast('أدخل مبلغاً صحيحاً / Enter a valid amount'); return; }

  const entry = {
    id: Date.now(),
    type: entryType,
    amount: amount,
    note: note,
    date: date
  };

  if (!DB.entries[currentName]) DB.entries[currentName] = [];
  DB.entries[currentName].unshift(entry);
  save(); // AUTO-SAVE immediately

  document.getElementById('eAmount').value = '';
  document.getElementById('eNote').value = '';
  document.getElementById('eDate').value = today();

  renderLedger();
  toast(entryType === 'credit' ? '✓ دائن محفوظ' : '✓ مدين محفوظ');
}

function deleteEntry(id) {
  if (!confirm('حذف هذه المعاملة؟\nDelete this entry?')) return;
  DB.entries[currentName] = (DB.entries[currentName] || []).filter(e => e.id !== id);
  save();
  renderLedger();
}

function renderLedger() {
  const entries = DB.entries[currentName] || [];
  let credit = 0, debit = 0;
  entries.forEach(e => { if (e.type === 'credit') credit += e.amount; else debit += e.amount; });
  const bal = credit - debit;

  document.getElementById('sumCredit').textContent = fmt(credit);
  document.getElementById('sumDebit').textContent = fmt(debit);
  document.getElementById('sumBalance').textContent = (bal >= 0 ? '+' : '-') + fmt(bal);
  document.getElementById('sumBalance').style.color = bal > 0 ? '#1a7a4a' : bal < 0 ? '#d32f2f' : '#1565c0';

  const balText = bal > 0 ? `له ${fmt(bal)}` : bal < 0 ? `عليه ${fmt(Math.abs(bal))}` : 'متسوي';
  document.getElementById('ledgerBalHeader').textContent = balText;
  document.getElementById('ledgerBalHeader').style.color = bal > 0 ? '#a5d6b7' : bal < 0 ? '#ffaaaa' : '#fff';

  const txList = document.getElementById('txList');
  if (!entries.length) {
    txList.innerHTML = '<div class="no-tx">لا توجد معاملات بعد<br>No entries yet</div>';
    return;
  }

  // Calculate running balance (from oldest to newest for running total)
  const sorted = [...entries].sort((a, b) => a.id - b.id);
  const runMap = {};
  let running = 0;
  sorted.forEach(e => {
    running += e.type === 'credit' ? e.amount : -e.amount;
    runMap[e.id] = running;
  });

  txList.innerHTML = entries.map(e => {
    const runBal = runMap[e.id];
    const runText = runBal > 0 ? `رصيد: +${fmt(runBal)}` : runBal < 0 ? `رصيد: -${fmt(Math.abs(runBal))}` : 'رصيد: £0.00';
    return `
      <div class="tx-row ${e.type}">
        <button class="tx-del" onclick="deleteEntry(${e.id})">✕</button>
        <div class="tx-info">
          <div class="tx-type-label">${e.type === 'credit' ? '▲ دائن / CREDIT' : '▼ مدين / DEBIT'}</div>
          <div class="tx-note">${e.note || '—'}</div>
          <div class="tx-date">${e.date} &nbsp;|&nbsp; <span style="font-size:12px;color:#999">${runText}</span></div>
        </div>
        <div class="tx-amount">${e.type === 'credit' ? '+' : '-'}${fmt(e.amount)}</div>
      </div>`;
  }).join('');
}

// ══════════════════════════════════════
//  PDF EXPORT
// ══════════════════════════════════════
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const entries = DB.entries[currentName] || [];
  let credit = 0, debit = 0;
  entries.forEach(e => { if (e.type === 'credit') credit += e.amount; else debit += e.amount; });
  const bal = credit - debit;

  const W = 210, M = 14;

  // Header
  doc.setFillColor(26, 122, 74);
  doc.rect(0, 0, W, 40, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(22);
  doc.setFont('helvetica', 'bold');
  doc.text('Account Statement', M, 17);
  doc.setFontSize(13);
  doc.setFont('helvetica', 'normal');
  doc.text('دفتر الحسابات', M, 26);
  doc.setFontSize(11);
  doc.text(`Generated: ${new Date().toLocaleString('en-GB')}`, W - M, 26, { align: 'right' });

  // Customer box
  doc.setFillColor(240, 248, 244);
  doc.rect(M, 46, W - M * 2, 28, 'F');
  doc.setDrawColor(26, 122, 74);
  doc.rect(M, 46, W - M * 2, 28, 'S');
  doc.setTextColor(26, 122, 74);
  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.text(currentName, M + 6, 59);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(80, 80, 80);
  doc.text(`Total Entries: ${entries.length}`, M + 6, 68);

  // Summary boxes
  const bw = (W - M * 2 - 8) / 3;
  const bdata = [
    ['CREDIT', `+GBP ${Math.abs(credit).toFixed(2)}`, [26, 122, 74]],
    ['DEBIT', `-GBP ${Math.abs(debit).toFixed(2)}`, [211, 47, 47]],
    ['BALANCE', `${bal >= 0 ? '+' : '-'}GBP ${Math.abs(bal).toFixed(2)}`, bal >= 0 ? [21, 101, 192] : [211, 47, 47]],
  ];
  bdata.forEach(([label, val, rgb], i) => {
    const x = M + i * (bw + 4);
    doc.setFillColor(...rgb);
    doc.rect(x, 82, bw, 20, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    doc.text(label, x + bw / 2, 89, { align: 'center' });
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.text(val, x + bw / 2, 97, { align: 'center' });
  });

  // Table
  const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
  let running = 0;
  const rows = sorted.map((e, i) => {
    running += e.type === 'credit' ? e.amount : -e.amount;
    return [
      i + 1,
      e.date,
      e.type === 'credit' ? 'CREDIT' : 'DEBIT',
      e.note || '—',
      e.type === 'credit' ? `+${e.amount.toFixed(2)}` : '',
      e.type === 'debit' ? `-${e.amount.toFixed(2)}` : '',
      `${running >= 0 ? '+' : ''}${running.toFixed(2)}`,
    ];
  });

  doc.autoTable({
    startY: 110,
    head: [['#', 'Date', 'Type', 'Notes', 'Credit', 'Debit', 'Balance']],
    body: rows,
    styles: { fontSize: 10, cellPadding: 4 },
    headStyles: { fillColor: [26, 122, 74], textColor: 255, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [245, 250, 247] },
    columnStyles: {
      0: { cellWidth: 10, halign: 'center' },
      1: { cellWidth: 24 },
      2: { cellWidth: 18, halign: 'center' },
      3: { cellWidth: 60 },
      4: { cellWidth: 22, halign: 'right', textColor: [26, 122, 74] },
      5: { cellWidth: 22, halign: 'right', textColor: [211, 47, 47] },
      6: { cellWidth: 24, halign: 'right', fontStyle: 'bold' },
    },
    margin: { left: M, right: M },
    didParseCell: (d) => {
      if (d.section === 'body') {
        if (d.column.index === 2) {
          d.cell.styles.textColor = d.cell.raw === 'CREDIT' ? [26, 122, 74] : [211, 47, 47];
          d.cell.styles.fontStyle = 'bold';
        }
        if (d.column.index === 6) {
          const v = parseFloat(d.cell.raw);
          d.cell.styles.textColor = v >= 0 ? [21, 101, 192] : [211, 47, 47];
        }
      }
    }
  });

  // Footer
  const fY = doc.lastAutoTable.finalY + 8;
  doc.setFillColor(26, 122, 74);
  doc.rect(0, fY, W, 12, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.text('دفتر حسابات محمد محمود الحداد', M, fY + 8);
  doc.text(`Statement Date: ${new Date().toLocaleDateString('en-GB')}`, W - M, fY + 8, { align: 'right' });

  doc.save(`${currentName.replace(/\s+/g, '_')}_statement_${today()}.pdf`);
  toast('✓ تم تحميل الـ PDF');
}
</script>
</body>
</html>
